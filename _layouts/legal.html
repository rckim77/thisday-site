<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }} — This Day</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  {% include site-icons.html %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="legal-page">
  <a class="skip-link" href="#main">Skip to content</a>

  {% include site-header.html %}

  <main id="main" class="legal-main">
    <article class="container legal-content">
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>
  </main>

  <footer class="site-footer site-footer--compact">
    <div class="container footer-inner">
      <nav class="footer-nav" aria-label="Legal and support">
        <a href="{{ '/' | relative_url }}">App</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/terms' | relative_url }}">Terms of Use</a>
        <a href="mailto:daydreamiosapp@gmail.com">Contact</a>
      </nav>
      <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} Raymond Kim</p>
    </div>
  </footer>
</body>
</html>
